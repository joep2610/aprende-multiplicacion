<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Multiplica con Amy</title>
    <link rel="stylesheet" href="theme.css">
</head>

<body class="home">
    <header>
        <button class="logo" id="homeButton" aria-label="Volver al inicio">Multiplica<small>con <em>Amy</em></small></button>
        <nav class="tabs hidden" id="modeTabs" aria-label="Modo de juego">
            <button id="learnTab" class="active">Aprender</button>
            <button id="playTab">Practicar</button>
        </nav>
        <div class="utility"><button id="voice" aria-pressed="false">Voz: apagada</button></div>
    </header>
    <section class="welcome" id="welcome">
        <div class="welcome-panel">
            <h1>¡Hola, Amy!</h1><p>¿Qué hacemos hoy?</p>
            <div class="mode-cards">
                <button class="mode-card" id="chooseLearn"><span class="mode-icon" aria-hidden="true">📖</span><strong>Aprender</strong><small>Mira, cuenta y escucha</small></button>
                <button class="mode-card yellow" id="choosePlay"><span class="mode-icon" aria-hidden="true">🎯</span><strong>Practicar</strong><small>Responde y gana premios</small></button>
            </div>
        </div>
    </section>
    <main id="game" class="hidden">
        <div class="layout">
            <aside class="card sidebar">
                <h2 id="tableTitle">Elige tu tabla</h2>
                <div class="tables" id="tables"></div>
                <div class="factor-controls" id="factorControls">
                    <label class="label" for="factor">Multiplicar por:</label>
                    <div class="stepper"><button id="prevFactor" aria-label="Multiplicador anterior">‹</button><select id="factor"></select><button id="advanceFactor" aria-label="Multiplicador siguiente">›</button></div>
                </div>
            </aside>
            <section class="card game-card">
                <div id="learn">
                    <div class="equation" id="equation"></div>
                    <p class="sub" id="explain"></p>
                    <div class="groups" id="groups"></div>
                    <div class="sum" id="sum"></div>
                    <div class="actions"><button id="read">🔊 Escuchar</button><button id="nextFactor">Siguiente ejemplo ❯</button></div>
                </div>
                <div id="play" class="hidden">
                    <div class="scores"><div class="stars" id="stars" aria-live="polite">⭐ 0 estrellas</div><div class="stars mistakes" id="mistakes" aria-live="polite">❌ 0 incorrectas</div></div>
                    <div id="round">
                        <div class="round-status"><span id="counter"></span><div class="progress"><div id="bar"></div></div></div>
                        <div class="equation" id="question"></div>
                        <div class="answers" id="answers" aria-label="Elige la respuesta correcta"></div>
                        <div class="feedback" id="feedback" aria-live="polite"></div>
                        <div class="actions"><button id="hint">💡 Dame una pista</button><button class="hidden" id="nextQuestion">Siguiente ❯</button></div>
                        <div id="hintArea" class="hidden"><p class="sub" id="hintText"></p><div class="groups" id="hintGroups"></div></div>
                    </div>
                    <div id="finish" class="finish hidden"></div>
                    <div class="hintbox hidden" id="premio"></div>
                </div>
            </section>
            <aside class="companion" aria-label="Amy te anima"><div class="speech" id="encouragement">¡Así se multiplica!</div></aside>
        </div>
        <footer>Ing. John Jesus Epiquin Castillo.</footer>
    </main>
    <script>
        const $ = id => document.getElementById(id);
        let table = 6,
            factor = 4,
            mode = 'learn',
            voice = false,
            stars = 0,
            deck = [],
            index = 0,
            solved = false,
            firstTry = true,
            correct = 0,
            mistakes = 0;
        try { stars = Number(localStorage.getItem('amy-stars')) || 0 } catch (e) { }
        const tips = {
            1: 'Multiplicar por 1 deja el mismo número.',
            2: 'Suma el número consigo mismo.',
            3: 'Duplica el número y suma una vez más el número.',
            4: 'Duplica el número y vuelve a duplicar el resultado.',
            5: 'Multiplica por 10 y toma la mitad.',
            6: 'Multiplica por 5 y suma una vez más el número.',
            7: 'Multiplica por 5 y suma dos veces más el número.',
            8: 'Duplica el número tres veces.',
            9: 'Multiplica por 10 y resta una vez el número.',
            10: 'Para estos números enteros, agrega un cero al final.',
            11: 'Multiplica por 10 y suma una vez más el número.',
            12: 'Multiplica por 10 y suma el doble del número.'
        };
        const Premio = {
            1: 'S/. 0.50 céntimos.',
            2: 'S/. 1.00 Sol',
            3: 'S/. 5.00 Soles',
        };

        function OcultarPremio() {
            const premio = document.getElementById("premio");
            premio.classList.add("hidden");
        }
        function MostrarPremio(correct, table) {
            const premio = document.getElementById("premio");

            if ((table >= 1 && table <= 5) && (correct > 10 && correct <= 12)) 
            {
                $('premio').textContent = '🏆 ¡Felicitaciones, Amy! Ganaste: ' + Premio[1];
            }
            else if ((table==6 || table==7 || table==10) && (correct > 8 && correct <= 11)) 
            {
                $('premio').textContent = '🏆 ¡Felicitaciones, Amy! Ganaste: ' + Premio[2];
            }
            else if ((table==8 || table==9 || table== 11 || table == 12) && correct == 12) 
            {
                $('premio').textContent = '🏆 ¡Felicitaciones, Amy! Ganaste: ' + Premio[3];
            }
            else {
                $('premio').textContent = '🏆 Sigue intentando 🏆';
            }

            premio.classList.remove("hidden");
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'es-PE';
                u.rate = .85;
                speechSynthesis.speak(u)
            }
        }
        function say(t) {
            if (voice) speak(t)
        }
        function updateStars() {
            $('stars').textContent = '⭐ ' + stars + ' estrellas';
            try {
                localStorage.setItem('amy-stars', String(stars))
            }
            catch (e) { }
        }
        function drawGroups(id, a, b) {
            $(id).innerHTML = Array.from({ length: a }, (_, i) => '<div class="group"><div class="dots">' + ('<span class="dot" aria-hidden="true">⭐</span>'.repeat(b)) + '</div></div>').join('');
            $(id).setAttribute('aria-label', a + ' grupos con ' + b + ' estrellas cada uno')
        }
        function render() {
            $('tableTitle').textContent = mode === 'play' ? 'Tabla del ' + table : 'Elige tu tabla';
            $('factor').value = factor;
            document.querySelectorAll('#tables button').forEach(b => {
                b.classList.toggle('active', +b.dataset.n === table);
                b.setAttribute('aria-pressed', +b.dataset.n === table)
            });
            //$('tip').textContent = '💡 Truco del ' + table + ': ' + tips[table];            
            $('equation').textContent = table + ' × ' + factor + ' = ' + table * factor;
            $('explain').textContent = table + ' grupos de ' + factor + ' estrellas';
            drawGroups('groups', table, factor); $('sum').textContent = Array(table).fill(factor).join(' + ') + ' = ' + table * factor;
        }
        function switchMode(m) {
            mode = m;
            document.body.classList.remove('home');
            $('welcome').classList.add('hidden');
            $('game').classList.remove('hidden');
            $('modeTabs').classList.remove('hidden');
            $('factorControls').classList.toggle('hidden', m === 'play');
            $('encouragement').textContent = m === 'play' ? '¡Tú puedes!' : '¡Así se multiplica!';
            $('learnTab').setAttribute('aria-pressed', m === 'learn');
            $('playTab').setAttribute('aria-pressed', m === 'play');
            render();
            $('learn').classList.toggle('hidden', m !== 'learn');
            $('play').classList.toggle('hidden', m !== 'play');
            $('learnTab').classList.toggle('active', m === 'learn');
            $('playTab').classList.toggle('active', m === 'play');
            $('factor').disabled = m === 'play'; if (m === 'play')
                start();
        }
        function shuffle(a) {
            for (let i = a.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]] } return a
        }
        function start() 
        {
            OcultarPremio();
            deck = shuffle(Array.from({ length: 12 }, (_, i) => i + 1));
            index = 0;
            mistakes = 0;
            correct = 0;
            $('mistakes').textContent = '❌ 0 incorrectas';
            $('round').classList.remove('hidden');
            $('finish').classList.add('hidden');
            question()
        }
        function question() {
            solved = false;
            firstTry = true;
            factor = deck[index];
            $('counter').textContent = 'Pregunta ' + (index + 1) + ' de 12';
            $('bar').style.width = (index / 12 * 100) + '%';

            $('question').textContent = table + ' × ' + factor + ' = ?'; $('feedback').textContent = '';
            $('hintArea').classList.add('hidden'); $('nextQuestion').classList.add('hidden'); $('hint').disabled = false;
            let answer = table * factor, options = new Set([answer]);
            while (options.size < 4) {
                let v = answer + (Math.floor(Math.random() * 9) - 4) * table;
                if (v > 0 && v !== answer) options.add(v)
            }
            $('answers').innerHTML = '';
            shuffle([...options]).forEach(v => {
                let b = document.createElement('button');
                b.textContent = v;
                b.onclick = () => check(v, b);
                $('answers').appendChild(b)
            });
            say('¿Cuánto es ' + table + ' por ' + factor + '?')
        }
        function check(v, b) {
            if (solved) return;
            if (v === table * factor) {
                solved = true; stars++;
                if (firstTry) correct++; updateStars();
                b.classList.add('correct'); $('feedback').textContent = '¡Muy bien! ' + table + ' × ' + factor + ' = ' + v + '. ¡Ganaste una estrella!';
                $('nextQuestion').classList.remove('hidden'); $('hint').disabled = true; say('¡Muy bien! ' + table + ' por ' + factor + ' es ' + v)
            }
            else {
                solved = true;
                firstTry = false;
                mistakes++;
                $('mistakes').textContent = '❌ ' + mistakes + ' incorrectas';
                b.classList.add('wrong');
                document.querySelectorAll('#answers button').forEach(answerButton => {
                    answerButton.disabled = true;
                    if (+answerButton.textContent === table * factor) {
                        answerButton.classList.add('correct');
                    }
                });
                $('feedback').textContent = 'La respuesta correcta es ' + table + ' × ' + factor + ' = ' + table * factor + '. Puedes pasar a la siguiente pregunta.';
                $('nextQuestion').classList.remove('hidden');
                $('hint').disabled = true;
                say('La respuesta correcta es ' + table * factor + '. Vamos a la siguiente pregunta.')
            }
        }
        function hint() {
            firstTry = false;
            $('hintArea').classList.remove('hidden');
            $('hintText').textContent = 'Cuenta ' + table + ' grupos de ' + factor + '. Suma ' + factor + ' cada vez.';
            drawGroups('hintGroups', table, factor)
        }

        $('nextQuestion').onclick = () => {
            if (!solved) return;

            index++;
            //Practicaste ${deck.length} multiplicaciones
            //de la tabla del ${table}.<br>
            if (index >= deck.length) {
                $('bar').style.width = '100%';
                $('round').classList.add('hidden');
                $('finish').classList.remove('hidden');
                $('finish').innerHTML = `
            <div class="big">🌟</div>
            <h2>¡Terminaste tu aventura!</h2>
            <p>                
                Respuestas correctas: ${correct}.
                <br>Respuestas incorrectas: ${mistakes}.
            </p>
            <p>¡Cada intento te ayuda a aprender!</p>
            <button class="primary" id="again">
                Volver a practicar
            </button>
        `;

                MostrarPremio(correct, table)

                $('again').onclick = () => {
                    stars = 0;
                    updateStars();
                    start();
                    OcultarPremio();
                };
                say('¡Felicitaciones! Terminaste tu aventura.');
            }
            else {
                question();
            }
        };

        for (let n = 1; n <= 12; n++) {
            let b = document.createElement('button');
            b.textContent = n;
            b.dataset.n = n;
            b.setAttribute('aria-label', 'Tabla del ' + n);
            b.onclick = () => {
                if (table !== n) {
                    stars = 0;
                    updateStars();
                    mistakes = 0;
                    $('mistakes').textContent = '❌ 0 incorrectas';
                }
                table = n;
                render();
                if (mode === 'play') start()
            };
            $('tables').appendChild(b)
        }

        for (let n = 1; n <= 12; n++) {
            $('factor').add(new Option(n, n))
        }

        $('factor').value = factor;
        $('factor').onchange = () => {
            factor = +$('factor').value;
            render()
        }; $('nextFactor').onclick = () => {
            factor = factor % 12 + 1;
            $('factor').value = factor;
            render();
            say(table + ' por ' + factor + ' es ' + table * factor)
        };
        $('learnTab').onclick = () => switchMode('learn');
        $('chooseLearn').onclick = () => switchMode('learn');
        $('choosePlay').onclick = () => switchMode('play');
        $('homeButton').onclick = () => {
            $('game').classList.add('hidden');
            $('modeTabs').classList.add('hidden');
            $('welcome').classList.remove('hidden');
            document.body.classList.add('home');
            if ('speechSynthesis' in window) speechSynthesis.cancel();
        };
        $('prevFactor').onclick = () => { factor = (factor + 10) % 12 + 1; render(); };
        $('advanceFactor').onclick = () => $('nextFactor').click();
        $('playTab').onclick = () => switchMode('play');
        $('hint').onclick = hint;
        $('read').onclick = () => speak(table + ' grupos de ' + factor + '. ' + table + ' por ' + factor + ' es ' + table * factor);
        $('voice').onclick = () => {
            voice = !voice; $('voice').textContent = 'Voz: ' + (voice ? 'encendida' : 'apagada');
            $('voice').setAttribute('aria-pressed', voice);
            if (!voice && 'speechSynthesis' in window) speechSynthesis.cancel()
        };
        if (!('speechSynthesis' in window)) {
            $('voice').classList.add('hidden');
            $('read').classList.add('hidden')
        } render();
        updateStars();
    </script>
</body>

</html>
